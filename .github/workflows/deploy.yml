name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build docs/
        run: python scripts/build-deploy.py

      - name: Inject Google Maps API key from secret
        env:
          GMAPS_API_KEY: ${{ secrets.GMAPS_API_KEY }}
        run: |
          if [ -z "$GMAPS_API_KEY" ]; then
            echo "::warning::GMAPS_API_KEY secret is empty — mapa i czasy dojazdu nie zadziałają w produkcji"
          fi
          mkdir -p docs
          printf "window.GMAPS_API_KEY = '%s';\n" "$GMAPS_API_KEY" > docs/config.local.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
